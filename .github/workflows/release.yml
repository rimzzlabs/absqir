name: Release

on:
  push:
    branches: [main]
  # A failed publish cannot be retried from the Actions page: a re-run repeats
  # release-please, which sees the tag and reports nothing new, so every
  # publish job skips. Run the workflow by hand with an existing tag instead.
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to publish, for example v0.1.0"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Each job asks for what it uses. The default for a job that asks for nothing
# is read-only.
permissions:
  contents: read

jobs:
  release-please:
    name: Release pull request
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  plan:
    name: Pick the tag to publish
    needs: release-please
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - name: Take the tag from the input, or from the release just created
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASED: ${{ needs.release-please.outputs.released }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$INPUT_TAG" in
              v[0-9]*) echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT" ;;
              *) echo "::error::The tag must look like v0.1.0, got '$INPUT_TAG'"; exit 1 ;;
            esac
          elif [ "$RELEASED" = "true" ]; then
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "No release to publish."
          fi

  # The tagged commit is the squash merge of the release pull request, and CI
  # checked that pull request before the merge. Nothing is checked twice here.
  #
  # On a manual run release-please is skipped, and GitHub skips every job
  # downstream of a skipped job unless its condition starts with a status
  # function. `!cancelled()` keeps the chain alive.
  docker:
    name: Publish the Docker image
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.plan.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  npm:
    name: Publish the CLI to npm
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - uses: ./.github/actions/setup
      - run: pnpm --filter absqir build
      - name: Set the CLI version from the tag
        working-directory: packages/cli
        run: npm version --no-git-tag-version "${TAG#v}"
        env:
          TAG: ${{ needs.plan.outputs.tag }}
      # No token. npm exchanges the job's OIDC token for a short-lived publish
      # credential, because this repo and workflow are the package's trusted
      # publisher on npmjs.com. The job's id-token permission makes that work.
      - name: Publish
        working-directory: packages/cli
        run: npm publish --provenance --access public
