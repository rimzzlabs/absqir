# Dependabot opens one pull request per group, once a week, with a commit
# message that passes commitlint (type chore, scope deps). Major versions of
# npm packages arrive on their own, because each one is a decision.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    ignore:
      # vocs pins the waku it supports. Its client root calls a router hook
      # that waku 1.0.0-rc.0 removed, and the docs site died on the first
      # client script. Lift this when a vocs release names the RC.
      - dependency-name: waku
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
