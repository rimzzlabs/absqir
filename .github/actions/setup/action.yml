name: Setup
description: Install pnpm, Node, and the workspace dependencies with a warm Turbo cache.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm

    # `pnpm install` runs `wrangler types` through the prepare script, and
    # wrangler reads the keys in .dev.vars. Without this copy the generated
    # Env type misses the secret keys and the typecheck fails in CI.
    - name: Create .dev.vars for type generation
      shell: bash
      run: cp apps/web/.dev.vars.example apps/web/.dev.vars

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Restore the Turbo cache
      uses: actions/cache@v6
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-
