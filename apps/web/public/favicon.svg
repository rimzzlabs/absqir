<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><title>absqir</title>
  <!-- Favicon build of the absqir mark: heavier strokes for 16 px, and a
       media query so it holds on dark browser chrome. -->
  <style>
    .ink-s { stroke: #131a26; }
    .ink-f { fill: #131a26; }
    .acc { fill: #2563eb; }
    @media (prefers-color-scheme: dark) {
      .ink-s { stroke: #e7ecf4; }
      .ink-f { fill: #e7ecf4; }
      .acc { fill: #7ca9ff; }
    }
  </style>
  <path class="ink-s" d="M36 9 H19 Q9 9 9 19 V45 Q9 55 19 55 H45 Q55 55 55 45 V28" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="acc" x="42.5" y="8" width="14" height="14" rx="4"/>
  <rect class="ink-f" x="24" y="24" width="16" height="16" rx="4"/>
</svg>
